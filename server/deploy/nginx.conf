# nginx in front of the CourtShot server: HTTPS, HSTS, compression, the client address.
# Copy to /etc/nginx/sites-available/courtshot, set server_name and the certificate paths,
# and link it into sites-enabled. Certificates: e.g. `certbot --nginx -d courtshot.example.org`.

server {
    listen 80;
    listen [::]:80;
    server_name courtshot.example.org;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.25.1 and later prefer `listen 443 ssl;` plus `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name courtshot.example.org;

    ssl_certificate     /etc/letsencrypt/live/courtshot.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courtshot.example.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Above COURTSHOT_MAX_CHUNK_BYTES (16 MiB by default); it also caps every JSON body.
    client_max_body_size 20m;

    # report.json and scene.json are large JSON; compress them on the fly.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/csv text/plain text/css application/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app takes the right-most entry, which nginx appends: the address it saw.
        # COURTSHOT_TRUSTED_PROXY=127.0.0.1 tells the app to trust it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads of 16 MiB chunks over slow links, and long video downloads.
        client_body_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Stream chunks and videos instead of buffering them to disk.
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
    }
}
