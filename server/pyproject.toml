[project]
name = "courtshot-server"
version = "0.1.0"
description = "CourtShot web server: API, queue and dashboard hosting"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "argon2-cffi",
    "pydantic-settings",
    # Byte ranges need >= 0.39; versions before 0.49.1 have CVE-2025-62727 in range handling.
    "starlette>=0.49.1",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
# The dev group pins httpx, which Starlette's TestClient still supports.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest"]
