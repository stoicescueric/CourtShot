# BoT-SORT with appearance matching (ReID) for the player tracker.
# Same thresholds as padex_bytetrack.yaml; on top of box overlap it compares
# what each player looks like, which helps when two players cross or one
# comes back after being hidden.
#   PADEX_TRACKER=padex_botsort.yaml bash run_match.sh video.mp4
tracker_type: botsort
track_high_thresh: 0.3
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 120
match_thresh: 0.9
fuse_score: True
gmc_method: none          # the camera is fixed: no camera-motion compensation needed
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto               # reuse the detector's own features (no extra model)
