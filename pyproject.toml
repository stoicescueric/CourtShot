[project]
name = "padex"
version = "0.1.0"
description = "Padel match video to player tracks, 3D ball flights, classified shots and a match report."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Xingnan Zhu" }]
keywords = ["padel", "sports-analytics", "computer-vision", "tracking", "shot-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "ultralytics>=8.1",    # YOLO people detector, ByteTrack, YOLO-Pose
    "lap>=0.5.12",         # needed by the ultralytics tracker
    "pydantic>=2.6",
    "scipy>=1.12",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",  # SigLIP, for telling the players apart by their looks
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.urls]
Repository = "https://github.com/rondo-labs/Padex"
Issues = "https://github.com/rondo-labs/Padex/issues"

[project.scripts]
padex = "padex.cli:main"

[dependency-groups]
dev = ["padex[dev]"]

# Windows: install the CUDA build of PyTorch (PyPI only has the CPU build
# there). macOS and Linux keep the default PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padex"]

[tool.hatch.build.targets.sdist]
include = ["src/padex/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B905",    # zip() without strict=: the sequences zipped here are built to match
    "E731",    # small lambdas bound to a name are used as local helpers
    "SIM108",  # an if/else block is often clearer than a long ternary
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
