[project]
name = "courtshot-inference"
version = "0.2.0"
description = "CourtShot pipeline adapted for headless jobs on Apple Silicon workers."
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
# Versions follow the root uv.lock (ultralytics 8.4.19, torch 2.10.0).
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.11,<4.12",
    "ultralytics==8.4.19",
    "lap>=0.5.12",
    "pydantic>=2.6,<3",
    "scipy>=1.12",
    "torch>=2.10,<2.11",
    "torchvision>=0.25,<0.26",
    "transformers>=4.45",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courtshot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B905",    # zip() without strict=: the sequences zipped here are built to match
    "E731",    # small lambdas bound to a name are used as local helpers
    "SIM108",  # an if/else block is often clearer than a long ternary
]
