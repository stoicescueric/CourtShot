<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* CourtShot brand: dark first. Ink background, Graphite cards, Fog text, Mist
   secondary text; Volt = data series 1 and the one key number, Court Blue =
   series 2, Clay = errors. Inter 400 / 500 / 600. */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --card: #1c1c1e; --raise: #2c2c2e; --line: rgba(255,255,255,.09); --line-strong: #3a3a3c;
  --text: #f5f5f7; --text2: #a1a1a6; --muted: #7c7c82;
  --t1: #d4f542; --t2: #4d8dff; --t1-soft: rgba(212,245,66,.16); --t2-soft: rgba(77,141,255,.2);
  --key: #d4f542; --clay: #ff8a65;
  --court: #111113; --court2: #161618; --court-line: rgba(255,255,255,.6); --court-text: rgba(245,245,247,.6);
  --accent: #f5f5f7; --accent-text: #000000;
  --heat1: linear-gradient(90deg, rgba(92,107,0,.35), #8fa71c, #d4f542, #fbffe0);
  --heat2: linear-gradient(90deg, rgba(36,72,160,.4), #3468d0, #4d8dff, #e3ecff);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f5f7; --card: #ffffff; --raise: #ededf0; --line: rgba(0,0,0,.08); --line-strong: #d2d2d7;
  --text: #000000; --text2: #55555a; --muted: #86868b;
  --t1: #5c6b00; --t2: #2f6fe6; --t1-soft: rgba(92,107,0,.12); --t2-soft: rgba(47,111,230,.12);
  --key: #5c6b00; --clay: #c8502a;
  --court: #f5f5f7; --court2: #efeff2; --court-line: rgba(0,0,0,.38); --court-text: rgba(0,0,0,.5);
  --accent: #000000; --accent-text: #f5f5f7;
  --heat1: linear-gradient(90deg, rgba(212,245,66,.35), #c3e230, #93aa14, #5c6b00);
  --heat2: linear-gradient(90deg, rgba(160,196,255,.45), #7daeff, #4d8dff, #1746b4);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01";
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 96px; }

/* header: lockup, then the match name in display type */
.brandbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0 0; }
.lockup { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 22px; letter-spacing: -.035em; color: var(--text); min-width: 120px; }
.lockup svg { width: 30px; height: 30px; flex: none; }
header.top { padding: 44px 0 20px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; justify-content: space-between; }
.eyebrow { font-size: 13px; color: var(--text2); font-weight: 500; }
h1 { font-size: clamp(36px, 6vw, 56px); line-height: 1.05; margin: 6px 0 10px; font-weight: 600; letter-spacing: -.035em; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--text2); font-size: 15px; }
.sides { display: flex; gap: 8px; flex-wrap: wrap; }
.side { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 14px 8px 12px; font-weight: 500; font-size: 14px; }
.side small { color: var(--muted); font-weight: 400; }

/* identity marks: colour AND shape. T_1 round, T_2 square; the second player of a pair is hollow */
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.T_1 { background: var(--t1); } .dot.T_2 { background: var(--t2); border-radius: 2.5px; }
.dot.ring { background: transparent !important; border: 2px solid; }
.dot.ring.T_1 { border-color: var(--t1); } .dot.ring.T_2 { border-color: var(--t2); }
.who { display: inline-flex; align-items: center; gap: 7px; }

nav.tabs { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  display: flex; gap: 2px; padding: 10px 0; margin-bottom: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
nav.tabs button, .seg button, .theme {
  font: inherit; font-size: 14px; color: var(--text2); background: transparent; border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; white-space: nowrap; font-weight: 500;
  transition: background .15s, color .15s;
}
nav.tabs button:hover, .seg button:hover, .theme:hover { color: var(--text); }
nav.tabs button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
nav.tabs .spacer { flex: 1; }
.theme { border: 1px solid var(--line-strong); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--t2); outline-offset: 2px; }

section.page { display: none; } section.page.on { display: block; animation: rise .25s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { section.page.on { animation: none; } }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); margin-top: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 24px 26px 26px; grid-column: span 12; min-width: 0; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; }
@media (max-width: 900px) { .c3 { grid-column: span 6; } .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; } .card { padding: 20px; border-radius: 20px; } }
@media (max-width: 520px) { .c3 { grid-column: span 12; } }
.card h2 { font-size: 19px; margin: 0 0 4px; font-weight: 600; letter-spacing: -.02em; }
.card .sub { color: var(--text2); font-size: 13.5px; margin: 0 0 18px; max-width: 68ch; }
.note { color: var(--text2); font-size: 15px; line-height: 1.55; }

/* match summary: stat numerals, one of them the key number */
.hero { margin-top: 16px; }
.hero-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 26px; }
.hero-head h2 { font-size: 22px; margin: 0; display: flex; align-items: center; gap: 12px; }
.hero-head h2 svg { width: 30px; height: 30px; }
.chip { font-size: 12.5px; color: var(--text2); border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 26px 20px; }
.stat .k { color: var(--text2); font-size: 13.5px; }
.stat .v { font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -.035em; font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; }
.stat .v small { font-size: 17px; font-weight: 400; letter-spacing: 0; color: var(--text2); margin-left: 6px; }
.stat.key .v { color: var(--key); }
.stat .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

/* team comparison rows */
.cmp-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-weight: 600; margin-bottom: 8px; }
.cmp-head div:last-child { text-align: right; }
.cmp { padding: 11px 0; border-top: 1px solid var(--line); }
.cmp .vals { display: grid; grid-template-columns: 112px 1fr 112px; align-items: center; }
.cmp .vals .lab { text-align: center; color: var(--text2); font-size: 14px; }
.cmp .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.cmp .v.r { text-align: right; }
.cmp .v span { display: inline-block; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.cmp .v.lead.T_1 span { background: var(--t1-soft); } .cmp .v.lead.T_2 span { background: var(--t2-soft); }
.cmp .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-top: 7px; }
.cmp .bars div { height: 4px; background: var(--raise); border-radius: 4px; position: relative; overflow: hidden; }
.cmp .bars i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.cmp .bars div:first-child i { right: 0; background: var(--t1); } .cmp .bars div:last-child i { left: 0; background: var(--t2); }

/* bar lists and stat lists */
.bl { display: grid; grid-template-columns: minmax(84px, max-content) 1fr max-content; gap: 10px 12px; align-items: center; }
.bl .k { color: var(--text2); font-size: 14px; }
.bl .track { height: 6px; background: var(--raise); border-radius: 4px; overflow: hidden; }
.bl .track i { display: block; height: 100%; border-radius: 4px; min-width: 2px; }
.bl .n { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 14px; text-align: right; }
.bl .n small { color: var(--muted); font-weight: 400; margin-left: 5px; }
.fill.T_1 { background: var(--t1); } .fill.T_2 { background: var(--t2); }
.sl { display: grid; grid-template-columns: 1fr auto; }
.sl > div { padding: 11px 0; border-top: 1px solid var(--line); }
.sl > div:nth-child(-n+2) { border-top: 0; padding-top: 2px; }
.sl .k { color: var(--text2); } .sl .n { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.sl .n small { color: var(--muted); font-weight: 400; }

/* mirrored shot-type bars */
.mir { display: grid; grid-template-columns: 30px 1fr minmax(104px, max-content) 1fr 30px; gap: 12px 10px; align-items: center; }
.mir .lab { text-align: center; color: var(--text2); font-size: 14px; }
.mir .n { font-weight: 600; font-variant-numeric: tabular-nums; } .mir .n.r { text-align: right; }
.mir .track { height: 6px; background: var(--raise); border-radius: 4px; position: relative; overflow: hidden; }
.mir .track i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.mir .track.l i { right: 0; background: var(--t1); } .mir .track.r i { left: 0; background: var(--t2); }

/* heatmaps */
.heat { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden; background: var(--court); border: 1px solid var(--line); }
.heat canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.heat .tag { position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--court-text); font-weight: 500; pointer-events: none; }
.heat .tag.net { top: 9px; } .heat .tag.back { bottom: 8px; }
.scales { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 16px; }
.scale { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; }
.scale i { width: 120px; height: 6px; border-radius: 4px; }
.scale i.T_1 { background: var(--heat1); } .scale i.T_2 { background: var(--heat2); }
.minis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .minis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mini { cursor: pointer; border: 0; background: none; padding: 0; text-align: left; font: inherit; color: inherit; border-radius: 16px; }
.mini .name { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; }
.mini .name small { color: var(--muted); font-weight: 400; margin-left: auto; font-size: 12.5px; }
.mini .heat { transition: transform .2s ease; } .mini:hover .heat { transform: scale(1.015); }

.seg { display: flex; gap: 2px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; width: fit-content; max-width: 100%; }
.seg button { display: inline-flex; align-items: center; gap: 8px; }
.seg button[aria-pressed="true"] .dot { background: var(--accent-text); }
.seg button[aria-pressed="true"] .dot.ring { border-color: var(--accent-text); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
select { font: inherit; font-size: 14px; font-weight: 500; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 11px 16px; }

svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.court-bg { fill: var(--court); } .court-ln { stroke: var(--court-line); fill: none; }
.shot { cursor: pointer; transition: opacity .12s; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--text2); font-size: 13px; margin-top: 14px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }

.scroll { overflow: auto; max-height: 560px; border-radius: 14px; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 11px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--card); color: var(--muted); font-weight: 500; font-size: 12.5px; z-index: 1; }
td.l, th.l { text-align: left; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--raise); }

#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 9px 12px; font-size: 13px; line-height: 1.4; max-width: 270px; opacity: 0; transition: opacity .1s; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
#tip b { display: block; font-weight: 600; } #tip.on { opacity: 1; }
.about dl { display: grid; grid-template-columns: max-content 1fr; gap: 12px 24px; margin: 0; max-width: 100ch; } .about dt { font-weight: 600; } .about dd { margin: 0; color: var(--text2); }
@media (max-width: 640px) { .about dl { grid-template-columns: 1fr; gap: 2px; } .about dd { margin-bottom: 12px; } }
.empty { color: var(--muted); padding: 18px 0; }
footer { color: var(--muted); font-size: 12.5px; margin-top: 40px; text-align: center; }
</style>
</head>

  <div class="brandbar">

  <section class="page about" id="p-about"></section>
  <footer>CourtShot · tracking and statistics</footer>
</div>

    mv.length ? h("div", { class: "scroll" }, h("table", {}, h("thead", {}, h("tr", {}, ["#", "Start", "End", "Length"].map(c => h("th", {}, c)))),
      h("tbody", {}, mv.map((r, i) => h("tr", {}, h("td", {}, String(i + 1)), h("td", {}, clock(r.start_s - D.t0)), h("td", {}, clock(r.end_s - D.t0)), h("td", {}, dur(r.duration_s))))))) : h("p", { class: "empty" }, "None found.")));
}

// ---------------------------------------------------------------- about
function about() {
  const q = D.quality, page = document.getElementById("p-about");
  const swaps = q.swaps_fixed.length ? `${q.swaps_fixed.length} identity swap(s) were corrected (at ${q.swaps_fixed.map(s => clock(s.time_s - D.t0)).join(", ")}).` : "no identity swaps were found.";
  page.append(h("div", { class: "grid" },
    card("c6", "Data quality", "Check these first: everything else is only as good as the tracking.", statList([
      ["Frames with the ball detected", pct(q.ball_coverage)],
      ["Ball detections kept after cleaning", pct(q.ball_kept)],
      ["3D ball flights", q.has_3d ? "fitted" : "not used"],
      ...D.players.map(p => [p.id + " tracked", pct(p.move.tracked), `(${pct(p.move.interpolated)} filled in)`]),
    ])),
    card("c6", "Player identities", null, h("p", { class: "note" },
      `The four players are followed by position and motion; ${q.tracker_ids_merged} raw tracker IDs were merged into them and ${q.interpolated_frames} frames filled in across short gaps. ` +
      (q.appearance_used ? `The result was checked against what the players look like: ${swaps} Players in the same kit can't be told apart this way.` : "Player looks were not checked (no appearance data next to the cache)."))),
    card("", "How the numbers are made", null, h("div", { html: `
      <dl>
        <dt>Positions</dt><dd>Each player's feet mapped through the court calibration (accuracy roughly 0.2–0.4 m). Distance and speed come from smoothed positions; standing still (under ${D.settings.still_speed} m/s) adds no distance. Position statistics count rally time only.</dd>
        <dt>Heatmaps</dt><dd>Share of rally time in each spot of the player's own half, flipped so the net is at the top whichever end they play from. Colour runs from little time (green) to most time (red), relative to that player's own busiest spot.</dd>
        <dt>Rallies</dt><dd>From the ball track (first shot to last ball movement) when the ball is seen often enough, otherwise from player movement.</dd>
        <dt>Shots</dt><dd>A shot is a change in the ball's path within a player's reach. Missed ball detections mean missed shots.</dd>
        <dt>Shot types</dt><dd>Decided by rules, not a trained model: contact above the head is a smash when fast and a bandeja / víbora otherwise (the two are not told apart); a ball that goes high, or that the opponents answer with an overhead, is a lob; taken before the bounce near the net is a volley; hard and high off the back wall is a bajada; soft and short from the back is a chiquita; other shots after the bounce are drives. Expect mistakes, mostly between neighbouring types.</dd>
        <dt>Speed</dt><dd>The launch speed of the fitted 3D flight when that fit is good, otherwise the average speed from the hitter to the landing spot (which reads lower).</dd>
        <dt>Contact height</dt><dd>Where the ball is within the hitter's outline in the image, scaled to a 1.75 m player.</dd>
        <dt>Direction and target</dt><dd>From where the hitter stood to where the ball landed (or to the opponent who played it next). Middle = within 1.25 m of the centre line.</dd>
        <dt>Winners and errors</dt><dd>An estimate from the last shot of each rally. They need whole points on video: a clip that starts or stops mid-rally has none.</dd>
      </dl>` }))));
}

// ---------------------------------------------------------------- shell
const TABS = [["overview", "Overview"], ["players", "Players"], ["shots", "Shots"], ["rallies", "Rallies"], ["about", "About the numbers"]];
function go(id, push = true) {
  if (!TABS.some(t => t[0] === id)) id = "overview";
  for (const [k] of TABS) {
    document.getElementById("p-" + k).classList.toggle("on", k === id);
    document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === id));
  }
  if (id === "players") players();
  if (id === "shots") shots();
  if (push) history.replaceState(null, "", "#" + id);
  scrollTo({ top: 0 });
}
function init() {
  document.title = D.title + " · CourtShot match report";
  document.getElementById("lockup").append(logo(), "CourtShot");
  document.getElementById("title").textContent = D.title;
  const m = D.match;
  document.getElementById("meta").append(...[dur(D.duration_s) + " analysed", m ? m.rallies + (m.rallies === 1 ? " rally" : " rallies") : null, m ? m.shots + " shots" : null]
    .filter(Boolean).map(t => h("span", {}, t)));
  document.getElementById("sides").append(...D.teams.map(t => h("div", { class: "side" }, h("i", { class: "dot " + t.id }), t.players.join(" · "), h("small", {}, t.id))));
  const tabs = document.getElementById("tabs");
  tabs.append(...TABS.map(([id, text]) => h("button", { id: "tab-" + id, role: "tab", onclick: () => go(id) }, text)), h("span", { class: "spacer" }),
    h("button", { class: "theme", onclick: toggleTheme, title: "Switch between the dark and the light version" }, "Appearance"));
  const forced = new URLSearchParams(location.search).get("theme");
  if (forced === "dark" || forced === "light") document.documentElement.dataset.theme = forced;
  overview(); rallies(); about();
  go(location.hash.slice(1) || "overview", false);
}
function toggleTheme() {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
  redraws.forEach(f => f());   // canvases read their colours from the theme
}
if (D) init(); else document.getElementById("title").textContent = "No data: this is the report template. Run `python -m courtshot report`.";
</script>
</body>
</html>
